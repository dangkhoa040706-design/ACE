spring.application.name=ace-hotel
server.port=8080

# --- CSDL: H2 che do FILE de tat bat ung dung van con du lieu (NFR-08). Doi sang MySQL chi can doi 4 dong nay (NFR-06).
spring.datasource.url=jdbc:h2:file:./data/ace
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# --- schema.sql la nguon su that, Hibernate khong tu tao bang
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Giao dien
spring.thymeleaf.cache=false
spring.web.locale=vi_VN

# --- Du lieu mau (sample-data.sql)
# Lan chay dau (bang users trong) tu nap du lieu mau. Muon nap lai sach: chay voi --ace.seed=true
ace.seed-if-empty=true
