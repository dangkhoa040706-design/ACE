<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đã xảy ra lỗi')}"></head>
<body>

<main class="center-page">
    <div class="theme-corner">
        <th:block th:replace="~{fragments/layout :: themeToggle}"></th:block>
    </div>
    <section class="error-box">
        <div class="code" th:text="${status} ?: 'Lỗi'">500</div>
        <h1>Đã xảy ra lỗi</h1>
        <p>Hệ thống gặp sự cố khi xử lý yêu cầu. Vui lòng thử lại hoặc quay về trang chủ.</p>
        <a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
    </section>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
