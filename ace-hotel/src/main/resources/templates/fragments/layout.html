<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== <head> dùng chung: th:replace="~{fragments/layout :: head('Tiêu đề')}" ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · ACE Hotel'">ACE Hotel</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <!-- Đặt data-theme trước khi vẽ trang để không bị nháy sáng. Mặc định Dark. -->
    <script>
        (function () {
            var t = 'dark';
            try { if (localStorage.getItem('ace-theme') === 'light') { t = 'light'; } } catch (e) { }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- ===== Nút đổi Dark / Light ===== -->
<button th:fragment="themeToggle" type="button" class="icon-btn" data-theme-toggle aria-label="Đổi giao diện sáng hoặc tối" title="Đổi giao diện sáng hoặc tối">
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<!-- ===== Script cuối trang ===== -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

<!-- ===== Thanh bên của ứng dụng. Mục quản lý chỉ hiện với vai trò MANAGER ===== -->
<aside th:fragment="sidebar(active)" class="sidebar" id="sidebar">
    <a class="side-brand" th:href="@{/dashboard}" aria-label="ACE Hotel - Dashboard">
        <img th:src="@{/images/logo-ace.png}" alt="ACE Hotel">
    </a>

    <nav class="side-nav" aria-label="Menu chính">
        <div class="group">Nghiệp vụ</div>
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
        <a th:href="@{/bookings/search}" th:classappend="${active == 'search'} ? 'active'">Tìm phòng &amp; đặt phòng</a>
        <a th:href="@{/bookings}" th:classappend="${active == 'bookings'} ? 'active'">Danh sách đặt phòng</a>
        <a th:href="@{/bookings(status='BOOKED')}" th:classappend="${active == 'checkin'} ? 'active'">Check-in</a>
        <a th:href="@{/bookings(status='CHECKED_IN')}" th:classappend="${active == 'checkout'} ? 'active'">Check-out &amp; thanh toán</a>
        <a th:href="@{/bookings(status='CHECKED_IN',view='services')}" th:classappend="${active == 'services-in-house'} ? 'active'">Dịch vụ phòng đang ở</a>
        <a th:href="@{/rooms}" th:classappend="${active == 'rooms'} ? 'active'">Phòng</a>

        <th:block sec:authorize="hasRole('MANAGER')">
            <div class="group">Quản lý</div>
            <a th:href="@{/room-types}" th:classappend="${active == 'room-types'} ? 'active'">Loại phòng</a>
            <a th:href="@{/services}" th:classappend="${active == 'services'} ? 'active'">Danh mục dịch vụ</a>
            <a th:href="@{/reports}" th:classappend="${active == 'reports'} ? 'active'">Thống kê</a>
        </th:block>
    </nav>

    <div class="side-user">
        <div class="who">
            <strong sec:authentication="principal.fullName">Người dùng</strong>
            <span sec:authentication="principal.roleLabel">Vai trò</span>
        </div>
        <a class="btn btn-secondary btn-sm" th:href="@{/}">Về trang chủ</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary btn-sm" style="width:100%">Đăng xuất</button>
        </form>
    </div>
</aside>

<!-- ===== Thanh trên của ứng dụng ===== -->
<header th:fragment="topbar(title)" class="topbar">
    <button type="button" class="icon-btn nav-toggle" data-nav-toggle aria-label="Mở menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 th:text="${title}">Tiêu đề</h1>
    <span class="date" th:text="${todayLabel}">Thứ Hai, 12/10/2026</span>
    <th:block th:replace="~{fragments/layout :: themeToggle}"></th:block>
</header>

</body>
</html>
