<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/public-layout :: layout(~{::title}, ~{::content})}">
<head>
  <title>403 - Quyền Truy Cập Bị Từ Chối | ACE Hotel</title>
</head>
<body>
  <div th:fragment="content" class="container" style="padding: 5rem 1rem; text-align: center; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 5rem; font-weight: 800; color: #F59E0B; margin-bottom: 1rem;">403</div>
    <h2 style="margin-bottom: 1rem; color: var(--text);">Truy Cập Bị Từ Chối</h2>
    <div class="card card-elevated" style="margin-bottom: 2rem; border-color: rgba(245, 158, 11, 0.4);">
      <p style="font-size: 1.05rem; color: #F59E0B; font-weight: 600; margin: 0;"
         th:text="${errorMessage != null ? errorMessage : 'Bạn không có quyền truy cập vào phân hệ chức năng này.'}">
        Bạn không có quyền truy cập vào phân hệ chức năng này.
      </p>
    </div>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Vui lòng đăng nhập với tài khoản có quyền phù hợp hoặc quay về trang chủ.</p>
    <div class="flex justify-center gap-3">
      <a th:href="@{/}" class="btn btn-primary">Về Trang Chủ</a>
      <a th:href="@{/login}" class="btn btn-secondary">Đổi Tài Khoản</a>
    </div>
  </div>
</body>
</html>
