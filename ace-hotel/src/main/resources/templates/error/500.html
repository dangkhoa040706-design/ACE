<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/public-layout :: layout(~{::title}, ~{::content})}">
<head>
  <title>500 - Sự Cố Hệ Thống | ACE Hotel</title>
</head>
<body>
  <div th:fragment="content" class="container" style="padding: 5rem 1rem; text-align: center; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 5rem; font-weight: 800; color: #EF4444; margin-bottom: 1rem;">500</div>
    <h2 style="margin-bottom: 1rem; color: var(--text);" th:text="${pageTitle != null ? pageTitle : 'Sự Cố Hệ Thống'}">Sự Cố Hệ Thống</h2>
    <div class="card card-elevated" style="margin-bottom: 2rem; border-color: rgba(239, 68, 68, 0.4);">
      <p style="font-size: 1.05rem; color: #F87171; font-weight: 600; margin: 0;"
         th:text="${errorMessage != null ? errorMessage : 'Đã xảy ra sự cố trong quá trình xử lý yêu cầu.'}">
        Đã xảy ra sự cố trong quá trình xử lý yêu cầu.
      </p>
    </div>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Vui lòng thử lại sau ít phút hoặc liên hệ bộ phận hỗ trợ khách hàng ACE Hotel.</p>
    <div class="flex justify-center gap-3">
      <a th:href="@{/}" class="btn btn-primary">Về Trang Chủ</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Quay Lại</a>
    </div>
  </div>
</body>
</html>
