<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>

<main class="center-page">
    <div class="theme-corner">
        <th:block th:replace="~{fragments/layout :: themeToggle}"></th:block>
    </div>

    <section class="auth-card" aria-labelledby="login-title">
        <div class="brand-box">
            <img th:src="@{/images/logo-ace-name.png}" alt="ACE Hotel - Accommodation, Check-in &amp; Extras">
        </div>
        <h1 id="login-title">Đăng nhập</h1>
        <p class="sub">Dành cho lễ tân và quản lý khách sạn.</p>

        <div class="alert" role="alert" th:if="${param.error}">
            Tên đăng nhập hoặc mật khẩu không đúng.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Tên đăng nhập</label>
                <input class="input" type="text" id="username" name="username" placeholder="Nhập tên đăng nhập"
                       autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Mật khẩu</label>
                <input class="input" type="password" id="password" name="password" placeholder="Nhập mật khẩu"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Đăng nhập</button>
        </form>

        <a class="back" th:href="@{/}">← Về trang chủ</a>
    </section>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
